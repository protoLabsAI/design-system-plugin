id: design-system
name: Design System
version: 0.7.0
description: >-
  The agent's live window into a design system. Reads the configured repo's design
  tokens, the packages/ui component inventory, and the visual-identity rules STRAIGHT FROM
  protoContent — so the current design vocabulary is never a stale copy frozen in knowledge.
  Tools: read tokens / components / a component's story / the rules; lint code against the
  token vocabulary (ds_check); and a recurring DRIFT WATCH that nudges the agent when the
  design system moves (tokens change, components added/removed) so docs + consumers stay in
  sync. Read-live-not-cache is the whole point — the design system is a live source of truth.

# Per-agent opt-in (turned on via the frontend bundle's enable list); not shipped on.

# Defaults — overridable per agent (ADR 0019 settings below). Point at another studio
# repo / ref, or blank watch_cron to turn the drift watch off for this agent.
config:
  repo: protoLabsAI/protoContent      # owner/name the design system lives in
  ref: main                           # git ref to read
  tokens_path: packages/design-system/dist/tokens.json   # committed built token set (clean JSON)
  components_path: packages/ui/src                          # component sources (story files)
  tokens_css_path: packages/design-system/dist/tokens.css   # generated --pl-* vars (the token CONTRACT)
  # Root URL of the DS's PUBLISHED Storybook. This is what the console gallery renders —
  # one <iframe src=".../iframe?id=<story>"> per variant, so the explorer shows the real
  # library at its current deploy rather than a replica that drifts. Blank = gallery off.
  storybook_url: https://protocontent-storybook.pages.dev
  rules_path: docs/reference/visual-identity.md           # the when-to-use / what-we-don't-do rules
  watch_cron: "0 14 * * *"            # daily 14:00 UTC drift check; "" = watch off

# Settings (ADR 0019) — editable in the console.
settings:
  - {key: repo, label: "Design-system repo (owner/name)", type: string}
  - {key: ref, label: "Git ref", type: string}
  - {key: storybook_url, label: "Published Storybook URL", type: string, description: "Root of the design system's deployed Storybook — powers the Components gallery. Blank turns the gallery off."}
  - {key: watch_cron, label: "Drift-watch cron (blank = off)", type: string}

# Declarative transparency (shown in the console).
capabilities:
  network: ["api.github.com", "*"]  # the repo via the GitHub contents API, plus the configured
                                    # Storybook origin (operator-set, so it can be any host)
  filesystem: scoped            # one small drift snapshot in the instance data dir

# Auth: the GitHub contents API is read with GITHUB_TOKEN / GH_TOKEN from the env (protoContent
# is private). Same token the github plugin uses; no separate plugin secret.

# Console view (ADR 0038) — the design-system explorer. The plugin serves its own page;
# the console renders it in a sandboxed iframe, so there's no host build to keep in step.
views:
  # `palette: inline` puts this view behind ⌘K without a second page to maintain — the
  # palette morphs THIS page into its body rather than needing a compact variant.
  - { id: design-system, label: "Design System", icon: "Component", placement: right, path: "/plugins/design-system/view", palette: inline }

# Event bus (ADR 0039) — broadcast, so consumers subscribe by topic instead of this plugin
# knowing who they are. Emitted by ds_drift (and so by the recurring drift watch).
emits:
  - topic: design-system.drift-detected
    summary: "The design system moved — tokens changed and/or components were added/removed."
    payload:
      repo: string
      ref: string
      tokens_changed: boolean
      components_added: string[]
      components_removed: string[]
subscribes: []

# skills/ auto-loads — the agent-facing contract for using the ds_* tools together.
